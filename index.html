<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💍 我們的專屬儲蓄追蹤器</title>
    <!-- 引入 Tailwind CSS 網頁版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React & ReactDOM (Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- 引入 Babel 用作瀏覽器即時編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* 自訂細節樣式 */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- STREAMING_CHUNK: 自定義 SVG 圖標組件 (無外部依賴，速度極快) ---
        const HeartIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        );
        const PlaneIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.9-.2-1.9.3-2.2 1.2-.3.9.1 1.9 1 2.2l8.5 3-3.5 3.5-3.2-.8c-.7-.2-1.4.1-1.7.7-.3.6-.1 1.4.4 1.8l3.6 2.4c.5.3 1.1.3 1.6 0l2.4-3.6c.4-.5.3-1.2-.3-1.5l-.8-3.2 3.5-3.5 3 8.5c.3.9 1.3 1.3 2.2 1 .9-.3 1.4-1.3 1.2-2.2z"/></svg>
        );
        const TrendingUpIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const WalletIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        );
        const PlusIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        );
        const HistoryIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/><line x1="12" y1="7" x2="12" y2="12"/><line x1="12" y1="12" x2="16" y2="14"/></svg>
        );
        const CheckCircle2Icon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        );
        const ZapIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        );
        const Trash2Icon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        );
        const AlertTriangleIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        );
        const SettingsIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        );
        const LandmarkIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 2 7 22 7 12 2"/></svg>
        );
        const Edit3Icon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        );
        const SaveIcon = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        );

        const ICON_MAP = {
            Heart: HeartIcon,
            Plane: PlaneIcon,
            TrendingUp: TrendingUpIcon,
            Wallet: WalletIcon
        };

        // --- STREAMING_CHUNK: 主 App 元件定義 ---
        function App() {
            // 1. 交易歷史紀錄狀態
            const [transactions, setTransactions] = useState(() => {
                try {
                    const saved = localStorage.getItem('coupleFinanceTxs_v4');
                    if (saved) return JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load transactions:', e);
                }
                return [];
            });

            // 2. 自訂目標金額狀態
            const [goals, setGoals] = useState(() => {
                try {
                    const saved = localStorage.getItem('coupleFinanceGoals_v4');
                    if (saved) return JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load goals:', e);
                }
                return {
                    wedding: { 
                        id: 'wedding',
                        title: '結婚基金', 
                        target: 100000, 
                        iconName: 'Heart', 
                        color: 'text-rose-500', 
                        bg: 'bg-rose-500',
                        lightBg: 'bg-rose-50',
                        type: 'shared'
                    },
                    travel: { 
                        id: 'travel',
                        title: '旅行基金', 
                        target: 40000, 
                        iconName: 'Plane', 
                        color: 'text-blue-500', 
                        bg: 'bg-blue-500',
                        lightBg: 'bg-blue-50',
                        type: 'shared'
                    },
                    personalUser: { 
                        id: 'personalUser',
                        title: '👩🏻 我的資產', 
                        target: 102000, 
                        iconName: 'TrendingUp', 
                        color: 'text-emerald-500', 
                        bg: 'bg-emerald-500',
                        lightBg: 'bg-emerald-50',
                        type: 'individual_user'
                    },
                    personalFiance: { 
                        id: 'personalFiance',
                        title: '🧑🏻 他的資產', 
                        target: 96000, 
                        iconName: 'Wallet', 
                        color: 'text-indigo-500', 
                        bg: 'bg-indigo-500',
                        lightBg: 'bg-indigo-50',
                        type: 'individual_fiance'
                    }
                };
            });

            // 3. 實時帳戶結餘狀態
            const [accounts, setAccounts] = useState(() => {
                try {
                    const saved = localStorage.getItem('coupleFinanceAccounts_v4');
                    if (saved) return JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load accounts:', e);
                }
                return [
                    { id: 'mortgageLink', name: '🏠 Mortgage-Link (👩🏻)', balance: 0, desc: '停泊結婚基金 & 我的個人儲蓄' },
                    { id: 'virtualBank', name: '✈️ 虛擬銀行子戶口', balance: 0, desc: '專用高息活期旅行基金' },
                    { id: 'userBrokerage', name: '📈 👩🏻 美股證券戶口', balance: 0, desc: '個人長線定投 (VOO)' },
                    { id: 'fianceSavings', name: '💼 🧑🏻 個人儲蓄戶口', balance: 0, desc: '他的個人流動儲蓄' }
                ];
            });

            // UI 狀態控制
            const [selectedGoal, setSelectedGoal] = useState('wedding');
            const [contributor, setContributor] = useState('user'); 
            const [amount, setAmount] = useState('');
            
            const [showSettings, setShowSettings] = useState(false);
            const [editingAccountId, setEditingAccountId] = useState(null);
            const [tempBalance, setTempBalance] = useState('');

            // 自定義模態確認視窗 (無阻擋、流暢)
            const [confirmModal, setConfirmModal] = useState({
                isOpen: false,
                type: '', // 'delete' | 'clear'
                targetId: null,
                message: ''
            });

            // 監聽並同步持久化到 LocalStorage (同瀏覽器秒載入)
            useEffect(() => {
                localStorage.setItem('coupleFinanceTxs_v4', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('coupleFinanceGoals_v4', JSON.stringify(goals));
            }, [goals]);

            useEffect(() => {
                localStorage.setItem('coupleFinanceAccounts_v4', JSON.stringify(accounts));
            }, [accounts]);

            // 自動根據目標類型鎖定存入者
            useEffect(() => {
                if (goals[selectedGoal].type === 'individual_user') {
                    setContributor('user');
                } else if (goals[selectedGoal].type === 'individual_fiance') {
                    setContributor('fiance');
                }
            }, [selectedGoal, goals]);

            // 計算累積進度
            const progress = useMemo(() => {
                const totals = { wedding: 0, travel: 0, personalUser: 0, personalFiance: 0 };
                transactions.forEach(t => {
                    if (totals[t.goalId] !== undefined) {
                        totals[t.goalId] += t.amount;
                    }
                });
                return totals;
            }, [transactions]);

            const formatMoney = (num) => {
                return new Intl.NumberFormat('zh-HK', { style: 'currency', currency: 'HKD', minimumFractionDigits: 0 }).format(num);
            };

            // 手動存入
            const handleManualDeposit = (e) => {
                e.preventDefault();
                if (!amount || isNaN(amount) || amount <= 0) return;

                let finalContributor = contributor;
                if (goals[selectedGoal].type === 'individual_user') finalContributor = 'user';
                if (goals[selectedGoal].type === 'individual_fiance') finalContributor = 'fiance';

                const amt = parseFloat(amount);

                const newTx = {
                    id: Date.now().toString(),
                    date: new Date().toLocaleDateString('zh-HK'),
                    goalId: selectedGoal,
                    contributor: finalContributor,
                    amount: amt
                };

                setTransactions([newTx, ...transactions]);

                // 智慧連動增加對應帳戶結餘
                setAccounts(prevAccounts => {
                    return prevAccounts.map(acc => {
                        if (selectedGoal === 'wedding' && acc.id === 'mortgageLink') return { ...acc, balance: acc.balance + amt };
                        if (selectedGoal === 'travel' && acc.id === 'virtualBank') return { ...acc, balance: acc.balance + amt };
                        if (selectedGoal === 'personalUser' && acc.id === 'userBrokerage') return { ...acc, balance: acc.balance + amt };
                        if (selectedGoal === 'personalFiance' && acc.id === 'fianceSavings') return { ...acc, balance: acc.balance + amt };
                        return acc;
                    });
                });

                setAmount('');
            };

            // --- STREAMING_CHUNK: 完美月份一鍵全目標存入 ---
            const handleQuickMonth = () => {
                const date = new Date().toLocaleDateString('zh-HK');
                const timestamp = Date.now();
                const quickTxs = [
                    { id: `${timestamp}-w1`, date, goalId: 'wedding', contributor: 'user', amount: 2812.5 },
                    { id: `${timestamp}-w2`, date, goalId: 'wedding', contributor: 'fiance', amount: 2812.5 },
                    { id: `${timestamp}-t1`, date, goalId: 'travel', contributor: 'user', amount: 1687.5 },
                    { id: `${timestamp}-t2`, date, goalId: 'travel', contributor: 'fiance', amount: 1687.5 },
                    { id: `${timestamp}-pu`, date, goalId: 'personalUser', contributor: 'user', amount: 8500 },
                    { id: `${timestamp}-pf`, date, goalId: 'personalFiance', contributor: 'fiance', amount: 8000 },
                ];
                setTransactions([...quickTxs, ...transactions]);

                // 同步增加實體帳戶餘額
                setAccounts(prevAccounts => {
                    return prevAccounts.map(acc => {
                        if (acc.id === 'mortgageLink') return { ...acc, balance: acc.balance + 5625 };
                        if (acc.id === 'virtualBank') return { ...acc, balance: acc.balance + 3375 };
                        if (acc.id === 'userBrokerage') return { ...acc, balance: acc.balance + 8500 };
                        if (acc.id === 'fianceSavings') return { ...acc, balance: acc.balance + 8000 };
                        return acc;
                    });
                });
            };

            // 調整目標
            const handleTargetChange = (goalId, newTarget) => {
                if (isNaN(newTarget) || newTarget < 0) return;
                setGoals(prev => ({
                    ...prev,
                    [goalId]: {
                        ...prev[goalId],
                        target: parseFloat(newTarget) || 0
                    }
                }));
            };

            // 編輯真實帳戶
            const startEditingAccount = (id, currentBalance) => {
                setEditingAccountId(id);
                setTempBalance(currentBalance.toString());
            };

            const saveAccountBalance = (id) => {
                const newBal = parseFloat(tempBalance);
                if (isNaN(newBal) || newBal < 0) return;
                setAccounts(prev => prev.map(acc => acc.id === id ? { ...acc, balance: newBal } : acc));
                setEditingAccountId(null);
            };

            // 觸發自定義 Modal 確認彈窗
            const triggerDelete = (id) => {
                setConfirmModal({
                    isOpen: true,
                    type: 'delete',
                    targetId: id,
                    message: '確定要刪除此筆存款紀錄嗎？（注意：此操作不會自動扣減您手動設定的實體帳戶結餘）'
                });
            };

            const triggerClear = () => {
                setConfirmModal({
                    isOpen: true,
                    type: 'clear',
                    targetId: null,
                    message: '警告：這將會清除所有的歷史存款紀錄，並將所有進度與帳戶結餘歸零。確定嗎？'
                });
            };

            const handleConfirmAction = () => {
                if (confirmModal.type === 'delete' && confirmModal.targetId) {
                    setTransactions(transactions.filter(t => t.id !== confirmModal.targetId));
                } else if (confirmModal.type === 'clear') {
                    setTransactions([]);
                    setAccounts(prev => prev.map(acc => ({ ...acc, balance: 0 })));
                    localStorage.removeItem('coupleFinanceTxs_v4');
                    localStorage.removeItem('coupleFinanceAccounts_v4');
                }
                closeConfirmModal();
            };

            const closeConfirmModal = () => {
                setConfirmModal({ isOpen: false, type: '', targetId: null, message: '' });
            };

            // --- STREAMING_CHUNK: 網頁 HTML 排版渲染 ---
            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-8">
                    
                    {/* Header 面板 */}
                    <header className="space-y-6">
                        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div className="text-center md:text-left">
                                <h1 className="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight flex items-center justify-center md:justify-start gap-2">
                                    💍 我們的專屬儲蓄追蹤器
                                </h1>
                                <p className="text-slate-500 text-sm mt-1">
                                    簡單、純粹、透明。每天都在離未來更近一步。
                                </p>
                            </div>
                            
                            <div className="flex justify-center gap-2">
                                <button 
                                    onClick={() => setShowSettings(!showSettings)}
                                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl border text-sm font-semibold transition-all ${
                                        showSettings 
                                            ? 'bg-slate-900 border-slate-900 text-white shadow-sm' 
                                            : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                                    }`}
                                >
                                    <SettingsIcon size={16} />
                                    <span>⚙️ 調整儲蓄目標</span>
                                </button>
                            </div>
                        </div>
                        
                        {/* 兩人的每月儲蓄目標簡介 */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-semibold text-slate-400 uppercase">👩🏻 我的每月儲蓄要求</p>
                                    <p className="text-2xl font-bold text-emerald-600 mt-1">$13,000</p>
                                    <p className="text-xs text-slate-500 mt-1">共同基金 $4,500 + 個人儲蓄 $8,500</p>
                                </div>
                                <div className="p-3 bg-emerald-50 rounded-2xl text-emerald-600">
                                    <TrendingUpIcon size={24} />
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-semibold text-slate-400 uppercase">🧑🏻 未婚夫的每月儲蓄要求</p>
                                    <p className="text-2xl font-bold text-indigo-600 mt-1">$12,500</p>
                                    <p className="text-xs text-slate-500 mt-1">共同基金 $4,500 + 個人儲蓄 $8,000</p>
                                </div>
                                <div className="p-3 bg-indigo-50 rounded-2xl text-indigo-600">
                                    <WalletIcon size={24} />
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* 隱藏/展開 目標調節設定板 */}
                    {showSettings && (
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4 animate-in slide-in-from-top-4 duration-200">
                            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                <h3 className="text-lg font-bold text-slate-950 flex items-center gap-2">
                                    <SettingsIcon className="text-slate-500" size={20} />
                                    調整儲蓄目標金額
                                </h3>
                                <p className="text-xs text-slate-400">修改將即時更新下方進度條</p>
                            </div>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                {Object.values(goals).map((g) => {
                                    const IconComponent = ICON_MAP[g.iconName];
                                    return (
                                        <div key={g.id} className="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                                            <div className="flex items-center gap-2">
                                                <div className={`p-1.5 rounded-lg ${g.lightBg} ${g.color}`}>
                                                    <IconComponent size={16} />
                                                </div>
                                                <span className="text-xs font-bold text-slate-700">{g.title}</span>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold text-slate-400 mb-1">目標金額 (HKD)</label>
                                                <div className="relative">
                                                    <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-semibold">$</span>
                                                    <input
                                                        type="number"
                                                        value={g.target}
                                                        onChange={(e) => handleTargetChange(g.id, e.target.value)}
                                                        className="w-full pl-6 pr-2 py-1.5 border border-slate-200 rounded-lg text-xs font-bold focus:outline-none focus:ring-1 focus:ring-slate-800"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* 四個核心目標進度 */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                        {Object.values(goals).map((goal) => {
                            const current = progress[goal.id];
                            const target = goal.target;
                            const percentage = target > 0 ? Math.min(100, (current / target) * 100).toFixed(1) : '0.0';
                            const IconComponent = ICON_MAP[goal.iconName];

                            return (
                                <div key={goal.id} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col hover:shadow-md transition-shadow">
                                    <div className="flex items-center justify-between mb-4">
                                        <div className={`p-2.5 rounded-xl ${goal.lightBg} ${goal.color}`}>
                                            <IconComponent size={20} />
                                        </div>
                                        {goal.type === 'shared' && <span className="text-[10px] font-bold px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full">雙人共同</span>}
                                        {goal.type === 'individual_user' && <span className="text-[10px] font-bold px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full">我專屬</span>}
                                        {goal.type === 'individual_fiance' && <span className="text-[10px] font-bold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">他專屬</span>}
                                    </div>
                                    
                                    <h2 className="text-base font-semibold text-slate-800 mb-1">{goal.title}</h2>
                                    
                                    <div className="mt-auto space-y-4">
                                        <div>
                                            <p className={`text-xl font-bold ${goal.color}`}>{formatMoney(current)}</p>
                                            <p className="text-xs text-slate-400 mt-0.5">目標 {formatMoney(target)}</p>
                                        </div>

                                        {/* 進度條 */}
                                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                            <div 
                                                className={`h-2.5 rounded-full transition-all duration-1000 ease-out ${goal.bg}`}
                                                style={{ width: `${percentage}%` }}
                                            />
                                        </div>
                                        
                                        <div className="flex justify-between text-xs text-slate-500 font-medium">
                                            <span>{percentage}%</span>
                                            <span>尚欠 {formatMoney(Math.max(0, target - current))}</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* 實體存款帳戶 實時對帳區 */}
                    <section className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-6">
                        <div className="flex items-center gap-2 pb-3 border-b border-slate-100">
                            <LandmarkIcon className="text-slate-400" size={22} />
                            <div>
                                <h3 className="text-lg font-bold text-slate-900">🏦 實時真實帳戶結餘</h3>
                                <p className="text-xs text-slate-500">對照您各實體銀行/按揭戶口的真實狀況，記帳時會同步累加，或點擊修改隨時手動調整校對。</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            {accounts.map((acc) => (
                                <div key={acc.id} className="p-4 rounded-xl border border-slate-100 bg-slate-50 hover:bg-slate-100/50 transition-colors flex flex-col justify-between space-y-3">
                                    <div className="space-y-1">
                                        <h4 className="text-sm font-bold text-slate-800">{acc.name}</h4>
                                        <p className="text-[11px] text-slate-400 leading-relaxed h-8">{acc.desc}</p>
                                    </div>

                                    <div className="pt-2 border-t border-slate-200/60 flex items-center justify-between">
                                        {editingAccountId === acc.id ? (
                                            <div className="flex items-center gap-1.5 w-full">
                                                <div className="relative flex-1">
                                                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-bold">$</span>
                                                    <input
                                                        type="number"
                                                        value={tempBalance}
                                                        onChange={(e) => setTempBalance(e.target.value)}
                                                        className="w-full pl-5 pr-2 py-1 border border-slate-300 rounded text-xs font-bold focus:outline-none"
                                                        placeholder="最新餘額"
                                                        autoFocus
                                                    />
                                                </div>
                                                <button 
                                                    onClick={() => saveAccountBalance(acc.id)}
                                                    className="p-1 bg-slate-900 hover:bg-slate-800 text-white rounded transition-colors"
                                                    title="儲存"
                                                >
                                                    <SaveIcon size={14} />
                                                </button>
                                            </div>
                                        ) : (
                                            <>
                                                <div>
                                                    <span className="text-xs text-slate-400 block">真實結餘</span>
                                                    <span className="text-base font-extrabold text-slate-900">{formatMoney(acc.balance)}</span>
                                                </div>
                                                <button 
                                                    onClick={() => startEditingAccount(acc.id, acc.balance)}
                                                    className="p-1.5 text-slate-400 hover:text-slate-800 hover:bg-slate-200/50 rounded-lg transition-colors"
                                                    title="手動修改結餘"
                                                >
                                                    <Edit3Icon size={14} />
                                                </button>
                                            </>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* 下方：記帳 + 歷史流水賬 */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        
                        {/* 手動 / 一鍵記帳 */}
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-6">
                            <div className="flex items-center space-x-2">
                                <PlusIcon className="text-slate-400" size={20} />
                                <h3 className="text-lg font-semibold">新增存款記錄</h3>
                            </div>
                            
                            {/* 一鍵完美存入 */}
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-3">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs font-semibold text-slate-500">自動化記帳</span>
                                    <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">最省時</span>
                                </div>
                                <button 
                                    onClick={handleQuickMonth}
                                    className="w-full group flex items-center justify-center space-x-2 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white py-3.5 rounded-xl font-semibold transition-all shadow-sm"
                                >
                                    <ZapIcon size={18} className="group-hover:scale-110 transition-transform" />
                                    <span>一鍵存入本月全目標 ($25,500)</span>
                                </button>
                                <p className="text-[11px] text-slate-400 text-center leading-relaxed">
                                    將自動分配：共同基金各入 $4,500（總 $9,000）+ 我個人 $8,500 + 他個人 $8,000，並自動累積至帳戶結餘。
                                </p>
                            </div>

                            {/* 手動輸入表單 */}
                            <form onSubmit={handleManualDeposit} className="space-y-4 pt-2 border-t border-slate-100">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5">選擇存入目標</label>
                                        <select 
                                            value={selectedGoal}
                                            onChange={(e) => setSelectedGoal(e.target.value)}
                                            className="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-800"
                                        >
                                            {Object.values(goals).map(g => (
                                                <option key={g.id} value={g.id}>{g.title}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5">存入者</label>
                                        <div className="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg">
                                            <button
                                                type="button"
                                                onClick={() => setContributor('user')}
                                                disabled={goals[selectedGoal].type === 'individual_fiance'}
                                                className={`py-1.5 text-xs rounded-md transition-all ${
                                                    contributor === 'user' && goals[selectedGoal].type !== 'individual_fiance'
                                                        ? 'bg-white text-slate-800 font-bold shadow-sm'
                                                        : 'text-slate-500 opacity-60'
                                                }`}
                                            >
                                                👩🏻 我
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setContributor('fiance')}
                                                disabled={goals[selectedGoal].type === 'individual_user'}
                                                className={`py-1.5 text-xs rounded-md transition-all ${
                                                    contributor === 'fiance' && goals[selectedGoal].type !== 'individual_user'
                                                        ? 'bg-white text-slate-800 font-bold shadow-sm'
                                                        : 'text-slate-500 opacity-60'
                                                }`}
                                            >
                                                🧑🏻 他
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">金額 (HKD)</label>
                                    <div className="relative">
                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-semibold">$</span>
                                        <input
                                            type="number"
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            placeholder="輸入手動存入金額..."
                                            className="w-full pl-7 pr-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800 text-sm"
                                        />
                                    </div>
                                </div>

                                <button 
                                    type="submit"
                                    disabled={!amount}
                                    className="w-full bg-slate-950 disabled:bg-slate-200 disabled:text-slate-400 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-800 transition-colors"
                                >
                                    手動確認存入
                                </button>
                            </form>
                        </div>

                        {/* 歷史流水流水賬 */}
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col h-[500px]">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center space-x-2">
                                    <HistoryIcon className="text-slate-400" size={20} />
                                    <h3 className="text-lg font-semibold">資金流水帳</h3>
                                </div>
                                {transactions.length > 0 && (
                                    <button 
                                        onClick={triggerClear}
                                        className="text-xs text-red-500 hover:underline font-semibold"
                                    >
                                        重置數據
                                    </button>
                                )}
                            </div>

                            <div className="flex-1 overflow-y-auto pr-1 space-y-2.5 custom-scrollbar">
                                {transactions.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 space-y-2 py-10">
                                        <CheckCircle2Icon size={36} className="text-slate-200" />
                                        <p className="text-xs">尚無任何存入歷史</p>
                                    </div>
                                ) : (
                                    transactions.map((tx) => {
                                        const goalInfo = goals[tx.goalId];
                                        return (
                                            <div key={tx.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl hover:bg-slate-100/80 border border-slate-100 transition-colors group">
                                                <div className="flex items-center space-x-3">
                                                    <div className={`w-1.5 h-8 rounded-full ${goalInfo.bg}`}></div>
                                                    <div>
                                                        <div className="flex items-center gap-1.5">
                                                            <span className="text-xs font-bold text-slate-700">{goalInfo.title}</span>
                                                            <span className="text-[10px] bg-white border border-slate-200 px-1.5 py-0.2 rounded-full text-slate-500 font-medium">
                                                                {tx.contributor === 'user' ? '👩🏻 我' : '🧑🏻 他'}
                                                            </span>
                                                        </div>
                                                        <p className="text-[10px] text-slate-400 mt-0.5">{tx.date}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-3">
                                                    <span className={`font-extrabold text-xs ${goalInfo.color}`}>
                                                        +{formatMoney(tx.amount)}
                                                    </span>
                                                    <button 
                                                        onClick={() => triggerDelete(tx.id)}
                                                        className="text-slate-300 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                                                    >
                                                        <Trash2Icon size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                    </div>

                    {/* 自訂確認視窗 Modal (React 內核防阻擋) */}
                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 space-y-4 animate-in fade-in zoom-in-95 duration-100">
                                <div className="flex items-start gap-3">
                                    <div className="p-2 bg-amber-50 text-amber-500 rounded-xl shrink-0">
                                        <AlertTriangleIcon size={20} />
                                    </div>
                                    <div className="space-y-1">
                                        <h4 className="font-bold text-slate-900">確認執行操作？</h4>
                                        <p className="text-xs text-slate-500 leading-relaxed">{confirmModal.message}</p>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button 
                                        onClick={closeConfirmModal}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-600 transition-colors"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        onClick={handleConfirmAction}
                                        className="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-xs font-semibold text-white transition-colors"
                                    >
                                        確認
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // 渲染 React 根節點
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
